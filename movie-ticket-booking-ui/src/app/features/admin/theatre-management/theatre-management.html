<div class="container-fluid admin-page py-5">

  <h1>Theatre Management</h1>
  <p class="text-secondary mb-4">
    Add and manage cinema theatres.
  </p>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div class="admin-form mb-5">

    <h4>{{ isEditing ? 'Edit Theatre' : 'Add Theatre' }}</h4>

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Theatre Name</label>
        <input class="form-control"
               type="text"
               [(ngModel)]="theatreForm.name"
               name="name">
      </div>

      <div class="col-md-6">
        <label class="form-label">Location</label>
        <input class="form-control"
               type="text"
               [(ngModel)]="theatreForm.location"
               name="location">
      </div>

    </div>

    <div class="mt-3">
      <button class="btn btn-danger me-2" (click)="saveTheatre()">
        {{ isEditing ? 'Update Theatre' : 'Add Theatre' }}
      </button>

      <button class="btn btn-outline-light" (click)="resetForm()">
        Clear
      </button>
    </div>

  </div>

  <div class="admin-table">

    <h4 class="mb-3">Theatre List</h4>

    <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border text-danger"></div>
    </div>

    <div class="table-responsive" *ngIf="!isLoading">

      <table class="table table-dark table-hover">

        <thead>
          <tr>
            <th>ID</th>
            <th>Theatre Name</th>
            <th>Location</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let theatre of theatres">
            <td>{{ theatre.theatreId }}</td>
            <td>{{ theatre.name }}</td>
            <td>{{ theatre.location }}</td>
            <td>
              <button class="btn btn-sm btn-outline-warning me-2"
                      (click)="editTheatre(theatre)">
                Edit
              </button>

              <button class="btn btn-sm btn-outline-danger"
                      (click)="deleteTheatre(theatre.theatreId)">
                Delete
              </button>
            </td>
          </tr>

          <tr *ngIf="theatres.length === 0">
            <td colspan="4" class="text-center">No theatres found.</td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

</div>
