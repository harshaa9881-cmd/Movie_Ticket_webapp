<div class="container-fluid admin-page py-5">

  <h1>Screen Management</h1>
  <p class="text-secondary mb-4">
    Manage screens under each theatre.
  </p>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div class="admin-form mb-5">

    <h4>{{ isEditing ? 'Edit Screen' : 'Add Screen' }}</h4>

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Theatre</label>

        <select class="form-select"
                [(ngModel)]="screenForm.theatreId"
                name="theatreId">

          <option [ngValue]="0">Select Theatre</option>

          <option *ngFor="let theatre of theatres"
                  [ngValue]="theatre.theatreId">
            {{ theatre.name }}
          </option>

        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Screen Name</label>

        <input type="text"
               class="form-control"
               [(ngModel)]="screenForm.screenName"
               name="screenName">
      </div>

    </div>

    <div class="mt-3">

      <button class="btn btn-danger me-2" (click)="saveScreen()">
        {{ isEditing ? 'Update Screen' : 'Add Screen' }}
      </button>

      <button class="btn btn-outline-light" (click)="resetForm()">
        Clear
      </button>

    </div>

  </div>

  <div class="admin-table">

    <div class="d-flex flex-column flex-md-row justify-content-between mb-3">

      <h4>Screens List</h4>

      <select class="form-select theatre-filter"
              [(ngModel)]="selectedTheatreId"
              name="selectedTheatreId"
              (change)="loadScreens()">

        <option [ngValue]="0">All Theatres</option>

        <option *ngFor="let theatre of theatres"
                [ngValue]="theatre.theatreId">
          {{ theatre.name }}
        </option>

      </select>

    </div>

    <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border text-danger"></div>
    </div>

    <div class="table-responsive" *ngIf="!isLoading">

      <table class="table table-dark table-hover">

        <thead>
          <tr>
            <th>ID</th>
            <th>Theatre</th>
            <th>Screen Name</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let screen of screens">
            <td>{{ screen.screenId }}</td>
            <td>{{ screen.theatreName }}</td>
            <td>{{ screen.screenName }}</td>

            <td>
              <button class="btn btn-sm btn-outline-warning me-2"
                      (click)="editScreen(screen)">
                Edit
              </button>

              <button class="btn btn-sm btn-outline-danger"
                      (click)="deleteScreen(screen.screenId)">
                Delete
              </button>
            </td>
          </tr>

          <tr *ngIf="screens.length === 0">
            <td colspan="4" class="text-center">No screens found.</td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
